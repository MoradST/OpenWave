name: Build OpenWave feed
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: write
  issues: read
concurrency:
  group: openwave-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build feed index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_feed.py
      - name: Commit updated feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A new issue or another workflow may update main while this job builds.
          # Regenerate from the latest main rather than rebasing a stale feed.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_feed.py
            git add docs/feed.json
            if git diff --cached --quiet; then
              echo "Feed is already up to date."
              exit 0
            fi
            git commit -m "chore: refresh OpenWave public feed"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update (attempt $attempt/3). Retrying..."
            sleep 3
          done
          echo "Failed to publish the feed after 3 attempts." >&2
          exit 1
