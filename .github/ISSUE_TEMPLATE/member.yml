name: "👋 Member profile"
description: "Introduce yourself to OpenWave — a public profile, no approval needed"
title: "[Member] "
body:
  - type: markdown
    attributes:
      value: |
        Welcome! This is your public introduction, not a feed update. By submitting, you agree to the community rules: https://github.com/MoradST/OpenWave/blob/main/TERMS.md . Privacy: https://github.com/MoradST/OpenWave/blob/main/PRIVACY.md . Conduct: https://github.com/MoradST/OpenWave/blob/main/CODE_OF_CONDUCT.md . Edit the title to "[Member] Your name or handle". Share only what you want to make public.
  - type: textarea
    id: introduction
    attributes:
      label: "About me"
      description: "Introduce yourself in your own words — background, interests, what you're building, or anything else."
      placeholder: "Hi! I'm..."
    validations:
      required: true
  - type: textarea
    id: interests
    attributes:
      label: "Topics and interests (optional)"
      placeholder: "AI, design, open source, books..."
    validations:
      required: false
  - type: textarea
    id: building
    attributes:
      label: "What I'm building or learning (optional)"
      description: "Share public projects, goals or areas you're exploring."
    validations:
      required: false
  - type: textarea
    id: help
    attributes:
      label: "What I can help with (optional)"
      description: "Skills or experience you would like to share."
    validations:
      required: false
  - type: textarea
    id: connections
    attributes:
      label: "Who I'd like to meet (optional)"
      description: "People, conversations or collaborations you would welcome. You can also say if you prefer not to receive discovery suggestions or contact."
    validations:
      required: false
  - type: input
    id: link
    attributes:
      label: "Website or social link (optional)"
      placeholder: "https://..."
    validations:
      required: false
  - type: input
    id: x_profile
    attributes:
      label: "Public X (Twitter) profile (optional)"
      description: "Your own public account, e.g. https://x.com/yourhandle"
      placeholder: "https://x.com/yourhandle"
    validations:
      required: false
  - type: dropdown
    id: x_sharing
    attributes:
      label: "Discover my public X conversations in OpenWave?"
      description: "Optional opt-in. Selecting Yes authorizes discovery and link-based summaries of your public X conversations, not copying full threads. Nothing is monitored yet."
      options:
        - "No — link only, do not monitor"
        - "Yes — opt in to future conversation discovery"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Profile type: member. You can add more details in comments. Please don't share private contact details, addresses or other people's information.
