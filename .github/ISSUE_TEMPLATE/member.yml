name: "👋 Member profile"
description: "Introduce yourself to OpenWave — a public profile, no approval needed"
title: "[Member] "
body:
  - type: markdown
    attributes:
      value: |
        Welcome! This is your public introduction, not a feed update. Edit the title to "[Member] Your name or handle". Share only what you want to make public.
  - type: textarea
    id: introduction
    attributes:
      label: "About me"
      description: "Introduce yourself in your own words — background, interests, what you're building, or anything else."
      placeholder: "Hi! I'm..."
    validations:
      required: true
  - type: textarea
    id: interests
    attributes:
      label: "Topics and interests (optional)"
      placeholder: "AI, design, open source, books..."
    validations:
      required: false
  - type: input
    id: link
    attributes:
      label: "Website or social link (optional)"
      placeholder: "https://..."
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Profile type: member. You can add more details in comments. Please don't share private contact details, addresses or other people's information.
