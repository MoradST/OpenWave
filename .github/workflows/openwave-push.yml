name: OpenWave push notifications
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
      API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Send category notification
        run: node scripts/send-openwave-push.mjs
